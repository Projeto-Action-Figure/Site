<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Edite os dados do seu perfil no TCG Cartoon.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../images/logos/cartoon-network-logo.png">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/home.css">
    <link rel="stylesheet" href="../styles/perfil.css">
    <script src="../scripts/perfil.js" defer></script>
    <title>Perfil | TCG Cartoon</title>
</head>
<body class="pagina-jogo pagina-perfil">
    <a class="skip-link" href="#conteudo">Pular para os dados cadastrais</a>

    <header class="cabecalho-jogo">
        <a class="perfil-jogador" href="perfil.html" aria-current="page">
            <img src="../images/icons/account-circle.png" alt="">
            <span>Meu nome</span>
        </a>
    </header>

    <main id="conteudo" tabindex="-1">
        <a class="link-voltar-perfil" href="home.html">
            <img src="../images/icons/chevron-left.png" alt="">
            Voltar
        </a>

        <section class="painel-perfil" aria-labelledby="titulo-perfil">
            <h1 id="titulo-perfil">Dados cadastrais</h1>
            <p class="introducao-perfil">Verifique ou edite os dados cadastrados</p>

            <form class="formulario-perfil" novalidate>
                <div class="campo-perfil">
                    <label for="nome">Nome</label>
                    <div class="grupo-entrada-perfil">
                        <img src="../images/icons/account-outline.png" alt="">
                        <input id="nome" name="nome" type="text" autocomplete="name" placeholder="Seu nome" aria-describedby="erro-nome" required>
                    </div>
                    <p class="erro-perfil" id="erro-nome" aria-live="polite"></p>
                </div>

                <div class="campo-perfil">
                    <label for="email">E-mail</label>
                    <div class="grupo-entrada-perfil">
                        <img src="../images/icons/email.png" alt="">
                        <input id="email" name="email" type="email" autocomplete="email" placeholder="nome@email.com" aria-describedby="erro-email" required>
                    </div>
                    <p class="erro-perfil" id="erro-email" aria-live="polite"></p>
                </div>

                <button class="botao-salvar-perfil" type="submit">Salvar alterações</button>
                <p class="mensagem-perfil" id="mensagem-perfil" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
</body>
</html>
