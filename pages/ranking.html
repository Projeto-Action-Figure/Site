<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acompanhe os rankings regional e global do TCG Cartoon.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../images/logos/cartoon-network-logo.png">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/home.css">
    <link rel="stylesheet" href="../styles/ranking.css">
    <script src="../scripts/ranking.js" defer></script>
    <title>Ranking | TCG Cartoon</title>
</head>
<body class="pagina-jogo pagina-ranking">
    <a class="skip-link" href="#conteudo">Pular para os rankings</a>

    <header class="cabecalho-jogo">
        <a class="perfil-jogador" href="perfil.html" aria-label="Abrir perfil do jogador">
            <img src="../images/icons/account-circle.png" alt="">
            <span>Meu nome</span>
        </a>
        <p class="saldo-moedas" aria-label="Moedas disponíveis: 0">
            <img src="../images/icons/diamond-badge.png" alt="">
            <span aria-hidden="true">0</span>
        </p>
    </header>

    <main id="conteudo" tabindex="-1">
        <section class="conteudo-ranking" aria-labelledby="titulo-ranking">
            <a class="link-voltar-home" href="home.html">
                <img src="../images/icons/chevron-left.png" alt="">
                <span>Home</span>
            </a>
            <h1 class="sr-only" id="titulo-ranking">Ranking da temporada</h1>
            <p class="estado-ranking" id="estado-ranking" role="status" aria-live="polite">Carregando ranking da temporada.</p>

            <section class="painel-ranking" aria-labelledby="titulo-regional">
                <header class="cabecalho-ranking">
                    <h2 id="titulo-regional">Rank Regional</h2>
                    <img src="../images/icons/ranking-podium.png" alt="">
                </header>
                <ol class="lista-ranking" id="ranking-regional" aria-label="Top 10 do ranking regional"></ol>
            </section>

            <section class="painel-ranking" aria-labelledby="titulo-global">
                <header class="cabecalho-ranking">
                    <h2 id="titulo-global">Rank Global</h2>
                    <img src="../images/icons/trophy.png" alt="">
                </header>
                <ol class="lista-ranking" id="ranking-global" aria-label="Top 10 do ranking global"></ol>
            </section>
        </section>

        <nav class="navegacao-jogo navegacao-ranking" aria-label="Seções do jogo">
            <a class="item-navegacao" href="cartas.html">
                <img src="../images/icons/playing-cards.png" alt="">
                <span>Cartas</span>
                <small>Veja sua coleção completa de cartas</small>
            </a>
            <a class="item-navegacao" href="loja.html">
                <img src="../images/icons/storefront.png" alt="">
                <span>Loja</span>
                <small>Compre pacotes de personagens</small>
            </a>
            <a class="item-navegacao ativo" href="ranking.html" aria-current="page">
                <img src="../images/icons/crossed-swords.png" alt="">
                <span>Ranking</span>
                <small>Acompanhe sua posição na temporada</small>
            </a>
        </nav>
    </main>
</body>
</html>
