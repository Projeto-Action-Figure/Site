<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Compre pacotes e recursos para o TCG Cartoon.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../images/logos/cartoon-network-logo.png">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/home.css">
    <link rel="stylesheet" href="../styles/loja.css">
    <script src="../scripts/loja.js" defer></script>
    <title>Loja | TCG Cartoon</title>
</head>
<body class="pagina-jogo pagina-loja">
    <a class="skip-link" href="#conteudo">Pular para os produtos da loja</a>

    <header class="cabecalho-jogo cabecalho-loja">
        <a class="perfil-jogador" href="perfil.html" aria-label="Abrir perfil do jogador">
            <img src="../images/icons/account-circle.png" alt="">
            <span>Meu nome</span>
        </a>
        <p class="reestoque-loja" aria-live="polite">
            <span>Reestoque de coleções:</span>
            <img src="../images/icons/clock.png" alt="">
            <strong id="cronometro-reestoque">30:00</strong>
        </p>
        <p class="saldo-moedas" aria-label="Moedas disponíveis: 0">
            <img src="../images/icons/diamond-badge.png" alt="">
            <span aria-hidden="true">0</span>
        </p>
    </header>

    <main id="conteudo" tabindex="-1">
        <section class="conteudo-loja" aria-labelledby="titulo-loja">
            <h1 id="titulo-loja">Loja</h1>
            <p class="estado-loja" id="estado-loja" role="status" aria-live="polite">Carregando produtos da loja.</p>
            <div class="grade-loja" id="grade-loja"></div>
            <p class="mensagem-loja" id="mensagem-loja" role="status" aria-live="polite"></p>
        </section>

        <nav class="navegacao-jogo navegacao-loja" aria-label="Seções do jogo">
            <a class="item-navegacao" href="cartas.html">
                <img src="../images/icons/playing-cards.png" alt="">
                <span>Cartas</span>
                <small>Veja sua coleção completa de cartas</small>
            </a>
            <a class="item-navegacao ativo" href="loja.html" aria-current="page">
                <img src="../images/icons/storefront.png" alt="">
                <span>Loja</span>
                <small>Compre pacotes de personagens</small>
            </a>
            <button class="item-navegacao" type="button" data-secao="Ranking">
                <img src="../images/icons/crossed-swords.png" alt="">
                <span>Ranking</span>
                <small>Acompanhe sua posição na temporada</small>
            </button>
        </nav>
    </main>
</body>
</html>
