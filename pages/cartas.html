<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Monte seu deck de cartas no TCG Cartoon.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../images/logos/cartoon-network-logo.png">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/home.css">
    <link rel="stylesheet" href="../styles/cartas.css">
    <script src="../scripts/cartas.js" defer></script>
    <title>Cartas | TCG Cartoon</title>
</head>
<body class="pagina-jogo pagina-cartas">
    <a class="skip-link" href="#conteudo">Pular para a coleção de cartas</a>

    <header class="cabecalho-jogo">
        <a class="perfil-jogador" href="perfil.html" aria-label="Abrir perfil do jogador">
            <img src="../images/icons/account-circle.png" alt="">
            <span>Meu nome</span>
        </a>
        <p class="saldo-moedas" aria-label="Moedas disponíveis: 0">
            <img src="../images/icons/diamond-badge.png" alt="">
            <span aria-hidden="true">0</span>
        </p>
    </header>

    <main id="conteudo" tabindex="-1">
        <section class="conteudo-cartas" aria-labelledby="titulo-cartas">
            <header class="cabecalho-colecao">
                <a class="voltar-home" href="home.html" aria-label="Voltar para a página inicial do jogo" title="Voltar para a página inicial">
                    <img src="../images/icons/chevron-left.png" alt="">
                    <span>Home</span>
                </a>
                <div>
                    <h1 id="titulo-cartas">Monte seu Deck</h1>
                    <p>Planeje estratégias contra seus adversários</p>
                </div>
            </header>

            <section class="secao-cartas" aria-labelledby="titulo-deck">
                <h2 id="titulo-deck">Seu Deck</h2>
                <p class="estado-cartas" id="estado-deck" role="status" aria-live="polite">Carregando seu deck.</p>
                <ul class="grade-deck" id="grade-deck" aria-label="Cartas do seu deck"></ul>
            </section>

            <section class="secao-cartas secao-colecao" aria-labelledby="titulo-colecao">
                <h2 id="titulo-colecao">Todas as cartas</h2>
                <p class="estado-cartas" id="estado-colecao" role="status" aria-live="polite">Carregando sua coleção.</p>
                <ul class="grade-colecao" id="grade-colecao" aria-label="Todas as cartas disponíveis"></ul>
            </section>
        </section>

        <nav class="navegacao-jogo navegacao-cartas" aria-label="Seções do jogo">
            <a class="item-navegacao ativo" href="cartas.html" aria-current="page">
                <img src="../images/icons/playing-cards.png" alt="">
                <span>Cartas</span>
                <small>Veja sua coleção completa de cartas</small>
            </a>
            <a class="item-navegacao" href="loja.html">
                <img src="../images/icons/storefront.png" alt="">
                <span>Loja</span>
                <small>Compre pacotes de personagens</small>
            </a>
            <button class="item-navegacao" type="button" data-secao="Ranking">
                <img src="../images/icons/crossed-swords.png" alt="">
                <span>Ranking</span>
                <small>Acompanhe sua posição na temporada</small>
            </button>
        </nav>
        <p class="mensagem-colecao" id="mensagem-colecao" role="status" aria-live="polite"></p>
    </main>
</body>
</html>
