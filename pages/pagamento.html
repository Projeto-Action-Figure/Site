<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Finalize sua compra no TCG Cartoon.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../images/logos/cartoon-network-logo.png">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/home.css">
    <link rel="stylesheet" href="../styles/pagamento.css">
    <script src="../scripts/pagamento.js" defer></script>
    <title>Pagamento | TCG Cartoon</title>
</head>
<body class="pagina-jogo pagina-pagamento">
    <a class="skip-link" href="#conteudo">Pular para o pagamento</a>

    <header class="cabecalho-jogo">
        <a class="perfil-jogador" href="perfil.html" aria-label="Abrir perfil do jogador">
            <img src="../images/icons/account-circle.png" alt="">
            <span>Meu nome</span>
        </a>
        <p class="saldo-moedas" aria-label="Moedas disponíveis: 0">
            <img src="../images/icons/diamond-badge.png" alt="">
            <span aria-hidden="true">0</span>
        </p>
    </header>

    <main id="conteudo" tabindex="-1">
        <section class="conteudo-pagamento" aria-labelledby="titulo-pagamento">
            <a class="link-voltar-loja" href="loja.html">
                <img src="../images/icons/chevron-left.png" alt="">
                <span>Voltar</span>
            </a>

            <form class="painel-pagamento" id="formulario-pagamento" novalidate>
                <header class="cabecalho-pagamento">
                    <h1 id="titulo-pagamento">Pagamento</h1>
                    <p>Preencha as informações solicitadas</p>
                </header>

                <section class="resumo-pagamento" aria-labelledby="titulo-valor">
                    <h2 id="titulo-valor">Valor da compra</h2>
                    <div class="valor-compra">
                        <img src="../images/icons/banknote.png" alt="">
                        <span id="valor-pedido">R$ 5,99</span>
                    </div>
                    <p class="descricao-pedido" id="descricao-pedido"></p>
                </section>

                <fieldset class="metodos-pagamento">
                    <legend>Método de pagamento</legend>
                    <div class="opcoes-pagamento">
                        <button class="opcao-pagamento" id="metodo-pix" type="button" aria-pressed="false">
                            <img src="../images/icons/payment-pix.png" alt="">
                            <span>PIX</span>
                        </button>
                        <button class="opcao-pagamento" id="metodo-cartao" type="button" aria-pressed="false">
                            <img src="../images/icons/payment-card.png" alt="">
                            <span>Cartão</span>
                        </button>
                    </div>
                </fieldset>

                <p class="instrucoes-pix" id="instrucoes-pix" hidden>Ao finalizar, o código PIX para pagamento será disponibilizado.</p>

                <div class="campos-cartao" id="campos-cartao" hidden>
                    <div class="campo-cartao campo-cartao-largo">
                        <label for="numero-cartao">Número do cartão</label>
                        <input id="numero-cartao" name="numero-cartao" type="text" inputmode="numeric" autocomplete="cc-number" maxlength="19" placeholder="0000 0000 0000 0000" aria-describedby="erro-cartao">
                    </div>
                    <div class="campo-cartao">
                        <label for="validade-cartao">Validade</label>
                        <input id="validade-cartao" name="validade-cartao" type="text" inputmode="numeric" autocomplete="cc-exp" maxlength="5" placeholder="MM/AA">
                    </div>
                    <div class="campo-cartao">
                        <label for="codigo-cartao">CVV</label>
                        <input id="codigo-cartao" name="codigo-cartao" type="text" inputmode="numeric" autocomplete="cc-csc" maxlength="4" placeholder="000">
                    </div>
                    <p class="erro-pagamento" id="erro-cartao" aria-live="polite"></p>
                </div>

                <button class="botao-finalizar" id="botao-finalizar" type="submit" disabled>Finalizar compra</button>
                <p class="mensagem-pagamento" id="mensagem-pagamento" role="status" aria-live="polite"></p>
            </form>

            <section class="confirmacao-pagamento" id="confirmacao-pagamento" aria-labelledby="titulo-confirmacao" hidden tabindex="-1">
                <img src="../images/icons/diamond-badge.png" alt="">
                <h2 id="titulo-confirmacao">Compra confirmada</h2>
                <p id="texto-confirmacao"></p>
                <a class="botao-continuar" href="loja.html">Voltar para a loja</a>
            </section>
        </section>
    </main>
</body>
</html>
