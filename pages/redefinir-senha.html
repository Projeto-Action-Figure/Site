<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Redefina a senha da sua conta TCG Cartoon.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../images/logos/cartoon-network-logo.png">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/login.css">
    <script src="../scripts/acessibilidade.js" defer></script>
    <title>Redefinir senha | TCG Cartoon</title>
</head>
<body class="pagina-login">
    <a class="skip-link" href="#conteudo">Pular para o formulário de redefinição de senha</a>

    <header class="barra-superior barra-login">
        <a class="brand" href="../index.html" aria-label="TCG Cartoon - início">
            <img class="cn-logo" src="../images/logos/cartoon-network-logo.png" alt="Cartoon Network">
            <span class="brand-name">TCG CARTOON</span>
        </a>
        <nav aria-label="Navegação principal">
            <a class="login-button" href="login.html">
                <img src="../images/icons/account-circle-small.png" alt="">
                Entrar
            </a>
        </nav>
    </header>

    <main class="conteudo-login" id="conteudo" tabindex="-1">
        <a class="link-voltar" href="login.html">
            <img src="../images/icons/chevron-left.png" alt="">
            Voltar
        </a>

        <section class="cartao-cadastro" aria-labelledby="titulo-redefinir-senha">
            <div class="conteudo-cartao-cadastro">
                <h1 id="titulo-redefinir-senha">Redefinir senha</h1>
                <p class="introducao-cadastro">Preencha as informações solicitadas.<br>Um e-mail de confirmação será enviado ao e-mail preenchido.</p>

                <form class="formulario-redefinir-senha" novalidate>
                    <div class="campo-formulario">
                        <label for="email">E-mail</label>
                        <div class="grupo-entrada">
                            <img src="../images/icons/email.png" alt="">
                            <input id="email" name="email" type="email" autocomplete="email" placeholder="nome@email.com" aria-describedby="erro-email" required>
                        </div>
                        <p class="erro-campo" id="erro-email" aria-live="polite"></p>
                    </div>

                    <div class="campo-formulario">
                        <label for="senha">Senha</label>
                        <div class="grupo-entrada">
                            <img src="../images/icons/lock.png" alt="">
                            <input id="senha" name="senha" type="password" autocomplete="new-password" minlength="8" placeholder="Mínimo 8 caracteres" aria-describedby="erro-senha" required>
                        </div>
                        <p class="erro-campo" id="erro-senha" aria-live="polite"></p>
                    </div>

                    <div class="campo-formulario">
                        <label for="confirmar-senha">Confirmar senha</label>
                        <div class="grupo-entrada">
                            <img src="../images/icons/lock.png" alt="">
                            <input id="confirmar-senha" name="confirmar-senha" type="password" autocomplete="new-password" minlength="8" placeholder="Repita sua senha" aria-describedby="erro-confirmar-senha" required>
                        </div>
                        <p class="erro-campo" id="erro-confirmar-senha" aria-live="polite"></p>
                    </div>

                    <button class="botao-enviar" type="submit">Redefinir senha</button>
                    <p class="mensagem-formulario" id="mensagem-redefinir-senha" role="status" aria-live="polite"></p>
                </form>
            </div>
            <div class="arte-cadastro" role="img" aria-label="Personagens do Cartoon Network em uma cena Arcade"></div>
        </section>
    </main>
</body>
</html>
