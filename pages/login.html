<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entre na sua conta TCG Cartoon.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../images/logos/cartoon-network-logo.png">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/login.css">
    <script src="../scripts/acessibilidade.js" defer></script>
    <title>Entrar | TCG Cartoon</title>
</head>
<body class="pagina-login">
    <a class="skip-link" href="#conteudo">Pular para o formulário de login</a>

    <header class="barra-superior barra-login">
        <a class="brand" href="../index.html" aria-label="TCG Cartoon - início">
            <img class="cn-logo" src="../images/logos/cartoon-network-logo.png" alt="Cartoon Network">
            <span class="brand-name">TCG CARTOON</span>
        </a>
        <nav aria-label="Navegação principal">
            <a class="signup-button" href="cadastro.html">Cadastre-se</a>
        </nav>
    </header>

    <main class="conteudo-login" id="conteudo" tabindex="-1">
        <a class="link-voltar" href="../index.html">
            <img src="../images/icons/chevron-left.png" alt="">
            Voltar
        </a>

        <section class="cartao-login" aria-labelledby="titulo-login">
            <div class="conteudo-cartao-login">
                <h1 id="titulo-login">Entrar</h1>
                <p class="introducao-login">Acesse sua conta para jogar</p>

                <form class="formulario-login" novalidate>
                    <div class="campo-formulario">
                        <label for="email">E-mail</label>
                        <div class="grupo-entrada">
                            <img src="../images/icons/email.png" alt="">
                            <input id="email" name="email" type="email" autocomplete="email" placeholder="nome@email.com" aria-describedby="erro-email" required>
                        </div>
                        <p class="erro-campo" id="erro-email" aria-live="polite"></p>
                    </div>

                    <div class="campo-formulario">
                        <label for="senha">Senha</label>
                        <div class="grupo-entrada">
                            <img src="../images/icons/lock.png" alt="">
                            <input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="••••••••" aria-describedby="erro-senha" required>
                        </div>
                        <p class="erro-campo" id="erro-senha" aria-live="polite"></p>
                    </div>

                    <p class="ajuda-senha"><a href="#recuperar-senha">Esqueci minha senha</a></p>
                    <button class="botao-enviar" type="submit">Entrar</button>
                    <p class="mensagem-formulario" id="mensagem-login" role="status" aria-live="polite"></p>
                </form>

                <p class="aviso-cadastro">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
            </div>
            <div class="arte-login" role="img" aria-label="Personagens do Cartoon Network em uma cena Arcade"></div>
        </section>
    </main>
</body>
</html>
